# Dataset configuration for Aerial / Sky Object Detection (Aircrafts, Birds, Drones)
# Classes: 3 (all 8,888 annotation files of the source dataset use only these ids).

# Ultralytics resolves a relative `path` against the current working directory, not against
# this file, so run training/validation from the repository root.
path: data
train: train/images
val: val/images

# Class mapping (0-indexed)
names:
  0: Aircrafts
  1: Bird
  2: Drone

# Source attribution
roboflow:
  workspace: subhranil-dey-wttsv
  project: drone-detection-axkso
  version: 3
  license: CC BY 4.0
  url: https://universe.roboflow.com/subhranil-dey-wttsv/drone-detection-axkso/dataset/3
