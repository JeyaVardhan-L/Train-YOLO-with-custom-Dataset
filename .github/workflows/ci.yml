name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests need only these; PyTorch and Ultralytics are not imported by them.
      - run: pip install pyyaml pillow numpy opencv-python-headless
      - run: python -m unittest discover -s tests -v
